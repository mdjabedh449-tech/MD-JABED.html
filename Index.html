
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>MD JABED | Official Profile</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:25px 15px;
 display:flex;align-items:center;justify-content:center;
 background:radial-gradient(ellipse at top,#30230d,#080808 65%);
 color:#fff;font-family:Arial,sans-serif
}
.card{
 width:100%;max-width:420px;padding:30px 22px;
 text-align:center;background:#111;
 border:1px solid #9c7937;border-radius:25px;
 box-shadow:0 0 35px #c49a3520
}
.avatar{
 width:125px;height:125px;border-radius:50%;
 object-fit:cover;border:3px solid #d6b15e;
 padding:4px;margin:18px auto
}
h1{color:#e5c16c;letter-spacing:3px;margin:8px 0}
.bio{color:#bcb5a5;font-size:14px;line-height:1.7}
.label{
 color:#d6b15e;font-size:11px;
 letter-spacing:3px;margin:25px 0 14px
}
.link{
 display:flex;align-items:center;gap:13px;
 padding:15px;margin:10px 0;text-align:left;
 text-decoration:none;color:white;
 background:#1a1a1a;border:1px solid #34302a;
 border-radius:12px;transition:.2s
}
.link:hover{border-color:#d6b15e;background:#262014}
.symbol{
 width:38px;height:38px;display:grid;
 place-items:center;border-radius:10px;
 background:#332817;color:#e5c16c;font-size:20px
}
.details{flex:1}
.title{font-size:14px;font-weight:bold}
.sub{font-size:11px;color:#aaa;margin-top:5px}
.arrow{color:#d6b15e;font-size:20px}
footer{margin-top:25px;color:#888;font-size:11px}
</style>
</head>

<body>
<main class="card">

 <div class="label">PERSONAL • OFFICIAL</div>

 <!-- CHANGE: Upload your photo as profile.jpg -->
 <img class="avatar" src="profile.jpg"
 alt="JABED profile photo"
 onerror="this.onerror=null;this.src='https://placehold.co/300x300/171717/d6b15e?text=YOUR+PHOTO'">

 <!-- CHANGE YOUR NAME AND BIO HERE -->
 <h1>MD JABED</h1>
 <p class="bio">
  Digital Creator | Bangladesh<br>
  Welcome to my official profile.
 </p>

 <div class="label">CONNECT WITH ME</div>

 <!-- EDIT YOUR SOCIAL LINKS BELOW -->

 <a class="link" href="https://facebook.com/YOUR_USERNAME"
 target="_blank" rel="noopener noreferrer">
  <span class="symbol">f</span>
  <span class="details">
   <div class="title">Facebook</div>
   <div class="sub">Visit my profile</div>
  </span>
  <span class="arrow">↗</span>
 </a>

 <a class="link" href="https://tiktok.com/@m.r.jabed.2.0"
 target="_blank" rel="noopener noreferrer">
  <span class="symbol">♪</span>
  <span class="details">
   <div class="title">TikTok</div>
   <div class="sub">Follow me</div>
  </span>
  <span class="arrow">↗</span>
 </a>

 <a class="link" href="https://wa.me/8801843373682"
 target="_blank" rel="noopener noreferrer">
  <span class="symbol">✆</span>
  <span class="details">
   <div class="title">WhatsApp</div>
   <div class="sub">Chat with me</div>
  </span>
  <span class="arrow">↗</span>
 </a>

 <!-- Replace with your actual IMO profile link if available -->
 <a class="link" href="https://imo.im/"
 target="_blank" rel="noopener noreferrer">
  <span class="symbol">◎</span>
  <span class="details">
   <div class="title">IMO</div>
   <div class="sub">Connect with me</div>
  </span>
  <span class="arrow">↗</span>
 </a>

 <!-- CHANGE NUMBER IN href ONLY; it is not displayed as text -->
 <a class="link" href="tel:+8801XXXXXXXXX">
  <span class="symbol">☎</span>
  <span class="details">
   <div class="title">Call Me</div>
   <div class="sub">Tap here to call</div>
  </span>
  <span class="arrow">↗</span>
 </a>

 <footer>
  © <span id="year"></span> MD JABED · ALL RIGHTS RESERVED
 </footer>

</main>

<script>
document.getElementById("year").textContent =
 new Date().getFullYear();
</script>
</body>
</html>
